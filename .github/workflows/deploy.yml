name: Verify and deploy dashboard

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix sheet-order-api
      - run: npm run lint
      - run: npm run type-check
      - run: node sheet-order-api/node_modules/typescript/bin/tsc --noEmit -p sheet-order-api/tsconfig.json
      - run: npm run test:run
      - run: npm run test:release
      - name: Build and record verified assets
        env:
          VITE_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
        run: |
          node scripts/pages-release.mjs build "$VITE_ENVIRONMENT"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-dashboard
          include-hidden-files: true
          path: |
            dist/
            .pages-release.json

  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    needs: verify
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix sheet-order-api
      - uses: actions/download-artifact@v4
        with:
          name: verified-dashboard
          path: .
      - name: Guarded deploy with Functions and binding verification
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NODE_OPTIONS: --use-system-ca
          RELEASE_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
        run: node scripts/pages-release.mjs deploy "$RELEASE_ENV"
